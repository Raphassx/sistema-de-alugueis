services:
  - type: web
    name: sistema-de-alugueis
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: DATA_DIR
        value: /var/data
    disk:
      name: sistema-data
      mountPath: /var/data
      sizeGB: 1
